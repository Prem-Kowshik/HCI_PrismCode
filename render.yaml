services:
  - type: web
    name: makeai-verify-hci
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: study-db-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/study_data.db
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
